name: 同步 Fork 并重命名文件

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync-and-rename:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: 同步上游并重命名
        run: |
          # 1. 添加并拉取上游
          git remote add upstream https://github.com/Usu171/favorites.git || true
          git fetch upstream main

          # 2. 合并上游更改
          echo "开始合并上游 main 分支..."
          if git merge upstream/main --no-ff --allow-unrelated-histories -m "chore: 同步上游内容"; then
            echo "合并成功"
          else
            echo "合并冲突，尝试自动解决或退出"
            git merge --abort
            exit 1
          fi

          # 3. 执行重命名逻辑
          echo "开始查找 HTML 文件..."
          # 排除 index.html 自身，寻找其他的 .html 文件
          HTML_FILE=$(find . -maxdepth 1 -type f -name "*.html" ! -name "index.html" | head -n 1)

          if [ -n "$HTML_FILE" ]; then
            echo "发现新文件: $HTML_FILE，准备重命名为 index.html"
            
            # 如果 index.html 已存在则先删除，确保 git mv 成功
            if [ -f "index.html" ]; then
              git rm -f index.html
            fi
            
            git mv "$HTML_FILE" index.html
            git commit -m "docs: 将 $(basename "$HTML_FILE") 重命名为 index.html" || echo "无变动"
          else
            echo "未发现需要重命名的 HTML 文件"
          fi

          # 4. 统一推送
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
